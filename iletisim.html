<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İletişim | Surgery-Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0ea5e9;
            --navy: #0f172a;
            --slate: #64748b;
            --bg: #f8fafc;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg); 
            color: var(--navy);
            line-height: 1.6;
        }

        /* NAVBAR UYUMU */
        .top-header {
            width: 100%; padding: 15px 30px; background: #fff;
            display: flex; align-items: center; border-bottom: 1px solid #e2e8f0;
            position: sticky; top: 0; z-index: 100;
        }
        .home-btn {
            background: var(--primary); color: #fff; padding: 8px 20px;
            border-radius: 10px; font-weight: 700; font-size: 0.8rem; text-decoration: none;
        }

        /* MAIN CONTENT */
        .contact-container {
            max-width: 1100px; margin: 50px auto;
            display: grid; grid-template-columns: 1fr 1.2fr;
            gap: 40px; padding: 0 20px;
        }

        /* SOL KOLON: BİLGİLER */
        .contact-info h1 {
            font-size: 2.5rem; font-weight: 800; margin-bottom: 15px;
            color: var(--navy); letter-spacing: -1px;
        }
        .contact-info p { color: var(--slate); margin-bottom: 30px; font-size: 1.1rem; }

        .info-card {
            background: white; padding: 20px; border-radius: 15px;
            margin-bottom: 20px; display: flex; align-items: center; gap: 20px;
            border: 1px solid #e2e8f0; transition: 0.3s;
        }
        .info-card:hover { transform: translateX(10px); border-color: var(--primary); }
        
        .icon-box {
            width: 50px; height: 50px; background: #f0f9ff;
            border-radius: 12px; display: flex; align-items: center;
            justify-content: center; font-size: 1.5rem; color: var(--primary);
        }

        .info-details h4 { font-weight: 700; font-size: 0.9rem; color: var(--slate); text-transform: uppercase; }
        .info-details p { margin: 0; font-weight: 600; color: var(--navy); font-size: 1rem; }

        /* SAĞ KOLON: FORM */
        .contact-form {
            background: white; padding: 40px; border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.03); border: 1px solid #e2e8f0;
        }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 0.9rem; }
        .form-group input, .form-group textarea {
            width: 100%; padding: 12px 15px; border-radius: 10px;
            border: 1px solid #e2e8f0; background: #fcfcfc;
            font-family: inherit; font-size: 1rem; outline: none; transition: 0.3s;
        }
        .form-group input:focus, .form-group textarea:focus {
            border-color: var(--primary); box-shadow: 0 0 0 4px rgba(14, 165, 233, 0.1);
        }

        .submit-btn {
            width: 100%; padding: 15px; background: var(--navy);
            color: white; border: none; border-radius: 12px;
            font-weight: 800; font-size: 1rem; cursor: pointer; transition: 0.3s;
        }
        .submit-btn:hover { background: var(--primary); transform: translateY(-3px); }

        /* MOBİL UYUM */
        @media (max-width: 900px) {
            .contact-container { grid-template-columns: 1fr; }
            .contact-info { text-align: center; }
            .info-card { text-align: left; }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <a href="index.html" class="home-btn">🏠 ANA SAYFA</a>
    </header>

    <div class="contact-container">
        <div class="contact-info">
            <h1>Benimle İletişime Geçin</h1>
            <p>Cerrahi disiplin ve formasyon için her türlü desteğe hazırız.</p>
            
            <div class="info-card">
                <div class="icon-box">📍</div>
                <div class="info-details">
                    <h4>Ameliyathane Hemşireliği</h4>
                    <p>Kanuni Sultan Süleyman Eğitim ve Araştırma Hastanesi</p>
                </div>
            </div>

            <div class="info-card">
                <div class="icon-box">📞</div>
                <div class="info-details">
                    <h4>e-mail</h4>
                    <p>sukruerdemresmi@gmail.com</p>
                </div>
            </div>

            <div class="info-card">
                <div class="icon-box">✉️</div>
                <div class="info-details">
                    <h4>E-Posta</h4>
                    <p>destek@surgery-mode.com</p>
                </div>
            </div>
        </div>

        <div class="contact-form">
            <form action="#">
                <div class="form-group">
                    <label>Adınız Soyadınız</label>
                    <input type="text" placeholder="Örn: Şükrü Erdem">
                </div>
                <div class="form-group">
                    <label>E-Posta Adresiniz</label>
                    <input type="email" placeholder="isim@domain.com">
                </div>
                <div class="form-group">
                    <label>Konu</label>
                    <input type="text" placeholder="Eğitim Talebi vb.">
                </div>
                <div class="form-group">
                    <label>Mesajınız</label>
                    <textarea rows="5" placeholder="Size nasıl yardımcı olabiliriz?"></textarea>
                </div>
                <button type="submit" class="submit-btn">MESAJI GÖNDER</button>
            </form>
        </div>
    </div>

</body>
</html>

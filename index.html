<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Surgery - Mode | SURGERY NURSE</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            text-decoration: none;
            -webkit-font-smoothing: antialiased;
        }

        body, html {
            height: 100%;
            width: 100%;
            font-family: 'Inter', -apple-system, sans-serif;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .live-background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(0,0,0,0.5), rgba(0,0,0,0.5)), 
                        url('assets/img/arkaplan.jpg') no-repeat center center;
            background-size: cover;
            z-index: -1;
            animation: bgZoom 15s infinite alternate;
        }

        @keyframes bgZoom {
            0% { transform: scale(1.0); }
            100% { transform: scale(1.1); }
        }

        .main-glass-panel {
            width: 90%;
            height: 85%;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(25px) saturate(180%);
            -webkit-backdrop-filter: blur(25px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 35px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            position: relative;
        }

        /* ÖZLÜ SÖZLER KONTEYNERI */
        .quote-container {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 280px;
            padding: 25px;
            text-align: center;
            color: rgba(255, 255, 255, 0.8);
            font-style: italic;
            transition: opacity 1s ease-in-out, transform 1s ease-in-out;
            pointer-events: none;
            background: rgba(255, 255, 255, 0.02);
            border-radius: 20px;
        }

        .quote-left { left: 40px; }
        .quote-right { right: 40px; }

        .quote-text {
            font-size: 1rem;
            line-height: 1.6;
            margin-bottom: 12px;
            font-weight: 300;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        .quote-author {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            text-transform: uppercase;
            color: #00d4ff;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .glass-header {
            width: 100%;
            padding: 30px 50px;
            display: flex;
            justify-content: flex-end;
            gap: 40px;
            z-index: 10;
        }

        .nav-link {
            color: rgba(255, 255, 255, 0.9);
            font-weight: 700;
            font-size: 1.1rem;
            text-transform: uppercase;
            transition: color 0.3s;
        }

        .nav-link:hover { color: rgba(255, 255, 255, 0.6); }

        .bottom-section {
            width: 100%;
            padding: 20px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            flex: 1;
            z-index: 5;
        }

        .ios-btn {
            width: 100%;
            max-width: 280px;
            height: 70px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 18px;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: #ffffff;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ios-btn:hover {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
        }

        .logo-badge {
            width: 75px;
            height: 75px;
            background: #ffffff;
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            font-weight: 800;
            color: #000000;
            margin-top: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }

        .black-footer {
            width: 100%;
            background-color: #000000;
            padding: 12px 0;
            text-align: center;
            z-index: 10;
        }

        .black-footer p {
            font-size: 0.75rem;
            color: #ffffff;
            letter-spacing: 1px;
        }

        /* MOBİLDE SÖZLERİ GİZLE */
        @media (max-width: 1100px) {
            .quote-container { display: none; }
        }

        .main-title {
    width: 100%;
    text-align: center;
    font-size: 3.5rem; /* Büyük ve etkileyici */
    font-weight: 800;
    color: #ffffff;
    letter-spacing: 12px; /* Harf arası boşluk kurumsal bir hava katar */
    text-transform: uppercase;
    margin-top: 20px;
    margin-bottom: -10px;
    opacity: 0.9;
    text-shadow: 0 0 20px rgba(255, 255, 255, 0.2); /* Hafif derinlik efekti */
    z-index: 5;
}

/* Mobilde başlığın taşmaması için */
@media (max-width: 600px) {
    .main-title {
        font-size: 1.8rem;
        letter-spacing: 5px;
        margin-top: 10px;
    }
}
    </style>
</head>
<body>

    <div class="live-background"></div>

    <div class="main-glass-panel">
        
        <!-- SOL SÖZ ALANI -->
        <div id="q-left" class="quote-container quote-left">
            <p class="quote-text" id="text-left"></p>
            <span class="quote-author" id="author-left"></span>
        </div>

        <!-- SAĞ SÖZ ALANI -->
        <div id="q-right" class="quote-container quote-right">
            <p class="quote-text" id="text-right"></p>
            <span class="quote-author" id="author-right"></span>
        </div>

        <header class="glass-header">
            <a href="index.html" class="nav-link">Anasayfa</a>
            <a href="hakkimda.html" class="nav-link">Hakkımda</a>
            <a href="iletisim.html" class="nav-link">İletişim</a>
        </header>

        <div class="main-title">SURGERY MODE</div>

        <div class="bottom-section">
            <a href="sterilizasyon.html" class="ios-btn">Sterilizasyon ve Kurallar<br>MODE</a>
            <a href="cerrahi.html" class="ios-btn">CERRAHİ<br>MODE</a>
            <a href="aletler.html" class="ios-btn">ALETLER<br>MODE</a>
            <a href="cihazlar.html" class="ios-btn">CİHAZLAR<br>MODE</a>

            <div class="logo-badge">NT</div>
        </div>

        <footer class="black-footer">
            <p>SAYFANIN TÜM HAKLARI ŞÜKRÜ ERDEM'E AİTTİR. ©2026</p>
        </footer>

    </div>

    <script>
        const quotes = [
            { t: "“Cerrahi, öğrenilmeden yapılmaz; yapılmadan öğrenilmez.”", a: "René Leriche" },
            { t: "“Her kesi, bir hayatı geri kazandırmak içindir.”", a: "Prof. Gazi Yaşargil" },
            { t: "“Sessizlik, sonsuzluğun elementidir. Ameliyathanedeki o gergin sessizlik, insanın doğaya karşı kazandığı zaferin en asil şarkısıdır.”", a: "Thomas Carlyle" },
            { t: "“Hayatta kalan, en güçlü olan değil, değişime en uyumlu olandır.”", a: "Charles Darwin" },
            { t: "“Hiçbir şey öğrenemeyeceğim kadar cahil birine hiç rastlamadım.”", a: "Galileo Galilei"},
            { t: "“Sinek küçük ama steril değildir. Ameliyathanede işi olmaz.”", a: "Şükrü ERDEM"},
            { t: "“Ameliyathane, insan iradesinin kaderle en organize şekilde kapıştığı arenadır.”", a: "Paul Valéry"},
            { t: "“Acı da iyi bir duygudur, çünkü incinen kısmın henüz çürümemiş olduğunu gösterir.”", a: "Baruch Spinoza" }
        ];

        let leftIndex = 0;
        let rightIndex = 1; // Sağ taraf bir sonraki sözden başlasın

        function updateQuotes() {
            const qLeft = document.getElementById('q-left');
            const qRight = document.getElementById('q-right');
            
            qLeft.style.opacity = 0;
            qRight.style.opacity = 0;

            setTimeout(() => {
                const quoteL = quotes[leftIndex];
                const quoteR = quotes[rightIndex];
                
                // Sol taraf güncelleme
                document.getElementById('text-left').innerText = quoteL.t;
                document.getElementById('author-left').innerText = quoteL.a;
                
                // Sağ taraf güncelleme
                document.getElementById('text-right').innerText = quoteR.t;
                document.getElementById('author-right').innerText = quoteR.a;

                qLeft.style.opacity = 1;
                qRight.style.opacity = 1;

                // İndeksleri kaydır
                leftIndex = (leftIndex + 1) % quotes.length;
                rightIndex = (rightIndex + 1) % quotes.length;
                
                // Eğer sol ve sağ aynı söze denk gelirse, sağ tarafı bir kez daha kaydır
                if(leftIndex === rightIndex) {
                    rightIndex = (rightIndex + 1) % quotes.length;
                }
            }, 1000);
        }

        updateQuotes();
        setInterval(updateQuotes, 5000);
    </script>

</body>
</html>

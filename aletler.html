            font-size: 1.1rem;

        .main-layout { max-width: 1200px; margin: 0 auto; padding: 0 20px 140px 20px; }
        .grid-title { margin: 30px 0 20px 0; font-weight: 800; font-size: 1.1rem; color: #38bdf8; text-transform: uppercase; letter-spacing: 1px; display: flex; align-items: center; gap: 10px; }

        function executeSearch() {
            const query = document.getElementById('masterSearch').value.trim().toUpperCase();
            const catView = document.getElementById('categoryContainer');
            const searchView = document.getElementById('searchWrapper');
            const resultsBox = document.getElementById('searchResults');

            if (query.length > 0) {
                catView.style.display = "none";
                searchView.style.display = "block";

                const filtered = instrumentsDatabase.filter(item => 
                    item.name.toUpperCase().includes(query)
                );

                resultsBox.innerHTML = "";
                if (filtered.length > 0) {
                    filtered.forEach(item => {
                        const card = document.createElement('div');
                        card.className = "product-result-card";
                        card.onclick = () => openModal(item);
                        card.innerHTML = `<h3>${item.name}</h3>`;
                        resultsBox.appendChild(card);
                    });
                } else {
                    resultsBox.innerHTML = "<p style='grid-column:1/-1; text-align:center; padding:50px; opacity:0.5;'>Alet bulunamadı...</p>";
                }
            } else {
                catView.style.display = "block";
                searchView.style.display = "none";
            }
        }

        function openModal(item) {
            document.getElementById('modalTitle').innerText = item.name;
            document.getElementById('modalDesc').innerText = item.desc;
            document.getElementById('modalImg').src = 'assets/img/' + item.img;
            document.getElementById('modalOverlay').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('modalOverlay').style.display = 'none';
        }
    </script>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Hazırlanıyor | Surgery Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --medical-blue: #00d4ff;
            --bg-dark: #0a0e14;
            --text-main: #e6edf3;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-dark);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--text-main);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 40px;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 40px;
            max-width: 500px;
            width: 90%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }

        .icon-box {
            font-size: 5rem;
            margin-bottom: 20px;
            position: relative;
            display: inline-block;
        }

        /* Yükleniyor Animasyonu */
        .loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 4px solid transparent;
            border-top: 4px solid var(--medical-blue);
            border-radius: 50%;
            animation: spin 2s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h1 {
            font-weight: 800;
            letter-spacing: 3px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }

        p {
            color: #8b949e;
            line-height: 1.6;
            margin-bottom: 30px;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            justify-content: center;
        }

        .btn {
            padding: 12px 25px;
            border-radius: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.3s;
            cursor: pointer;
            border: none;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
        }

        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
        }

        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .btn-home {
            background: var(--medical-blue);
            color: #000;
        }

        .btn-home:hover {
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.4);
            transform: translateY(-2px);
        }

        .status-badge {
            display: inline-block;
            padding: 5px 15px;
            background: rgba(0, 212, 255, 0.1);
            color: var(--medical-blue);
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="status-badge">SİSTEM GÜNCELLEMESİ</div>
        <div class="icon-box">
            <span>🛠️</span>
            <div class="loader"></div>
        </div>
        <h1>MODÜL HAZIRLANIYOR</h1>
        <p>Surgery Mode'un bu bölümü şu an sterilizasyon ve veri giriş aşamasındadır. Çok yakında hizmete açılacaktır.</p>

        <div class="btn-group">
            <!-- Geri tuşu tarayıcıda bir önceki sayfaya gönderir -->
            <button onclick="history.back()" class="btn btn-back">⬅ GERİ DÖN</button>
            <a href="index.html" class="btn btn-home">🏠 ANA SAYFA</a>
        </div>
    </div>

</body>
</html>

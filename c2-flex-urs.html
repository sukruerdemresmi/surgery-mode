<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistem Seçimi | f-URS Endovizyon</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --redpine-red: #cc0000;
            --hugemed-blue: #0056b3;
            --bg-light: #f4f7fa;
            --sky-blue: #0088cc;
        }

        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            background-color: var(--bg-light);
        }

        /* ÜST NAVİGASYON (Cihazlar Sayfasıyla Uyumlu) */
        .top-header { 
            width: 100%; 
            padding: 12px 25px; 
            display: flex; 
            align-items: center; 
            background: #fff; 
            border-bottom: 1px solid #e2e8f0; 
            position: absolute; 
            top: 0; 
            z-index: 1000; 
        }
        .back-btn { 
            background: var(--sky-blue); 
            color: #fff; 
            padding: 7px 15px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 0.7rem; 
            text-decoration: none;
            transition: 0.3s;
        }
        .back-btn:hover { background: #006699; transform: scale(1.05); }
        .header-title { 
            position: absolute; 
            left: 50%; 
            transform: translateX(-50%); 
            font-weight: 800; 
            font-size: 0.85rem; 
            color: var(--sky-blue); 
            letter-spacing: 0.5px; 
            text-transform: uppercase;
        }

        /* BÖLÜNMÜŞ EKRAN YAPISI */
        .split-container {
            display: flex;
            height: 100vh;
            width: 100vw;
            padding-top: 50px; /* Header için boşluk */
            box-sizing: border-box;
        }

        .split {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }

        /* Sol Taraf (Redpine) */
        .redpine-side {
            background-color: #fffafa;
            border-right: 1px solid #e2e8f0;
        }

        /* Sağ Taraf (Hugemed) */
        .hugemed-side {
            background-color: #f0f7ff;
        }

        .logo-img {
            max-width: 280px;
            height: auto;
            z-index: 2;
            transition: transform 0.5s ease;
            filter: drop-shadow(0 5px 15px rgba(0,0,0,0.05));
        }

        .system-title {
            margin-top: 25px;
            font-size: 1.4rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 2px;
            z-index: 2;
            transition: 0.3s;
        }

        .redpine-side .system-title { color: var(--redpine-red); }
        .hugemed-side .system-title { color: var(--hugemed-blue); }

        /* Hover Efektleri */
        .split:hover {
            flex: 1.4;
        }

        .redpine-side:hover { background-color: #ffebeb; }
        .hugemed-side:hover { background-color: #e1f0ff; }

        .split:hover .logo-img {
            transform: scale(1.08) translateY(-10px);
        }

        /* Orta Ayırıcı VS */
        .separator {
            position: absolute;
            left: 50%;
            top: 55%;
            transform: translate(-50%, -50%);
            background: white;
            width: 50px;
            height: 50px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 50%;
            font-weight: 900;
            color: #94a3b8;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            border: 2px solid #e2e8f0;
            z-index: 10;
            font-size: 0.9rem;
        }

        /* Alt Bilgi Tagları (Görseldeki alt bar stili) */
        .side-info {
            position: absolute;
            bottom: 40px;
            font-size: 0.7rem;
            font-weight: 700;
            color: #94a3b8;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        @media (max-width: 768px) {
            .split-container { flex-direction: column; }
            .separator { top: 50%; left: 50%; }
            .header-title { display: none; }
        }
    </style>
</head>
<body>

    <header class="top-header">
        <a href="cihazlar.html" class="back-btn">← CİHAZLARA DÖN</a>
        <div class="header-title">F-URS Endovizyon Sistem Seçimi</div>
    </header>

    <div class="split-container">
        <div class="separator">VS</div>

        <a href="redpine_detay.html" class="split redpine-side">
            <img src="assets/img/redpine-logo.jpg" alt="Redpine Logo" class="logo-img">
            <div class="system-title">Redpine</div>
            <div class="side-info">Dijital Esnek Sistem</div>
        </a>

        <a href="hugemed_detay.html" class="split hugemed-side">
            <img src="assets/img/hugemed-logo.jpg" alt="Hugemed Logo" class="logo-img">
            <div class="system-title">Hugemed</div>
            <div class="side-info">Portatif Görüntüleme</div>
        </a>
    </div>

</body>
</html>
